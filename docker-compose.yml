version: '3.7'

services:
  searxng:
    container_name: searxng
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./searxng-data:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_LIMITER=false
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui-local-agents
    ports:
      - "3000:8080"
    environment:
      - 'OPENAI_API_BASE_URL=http://host.docker.internal:8000' # Points to your Python Orchestrator
      - 'OPENAI_API_KEY=lemonade' # Filler key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui:/app/backend/data
    restart: always

volumes:
  open-webui: