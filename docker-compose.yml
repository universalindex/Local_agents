services:
  searxng:
    container_name: searxng
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      # Mounts your existing massive configuration directory
      - ./searxng-data:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_LIMITER=false
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ai-network
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui-local-agents
    ports:
      - "3000:8080"
    environment:
      # 1. Point to your local Python Orchestrator running on your laptop's Port 8000
      - 'OPENAI_API_BASE_URL=http://host.docker.internal:8000/v1'
      - 'OPENAI_API_KEY=lemonade' # Filler key
      
      # 2. Automatically configure Open-WebUI's Web RAG to use SearXNG
      - 'ENABLE_RAG_WEB_SEARCH=True'
      - 'RAG_WEB_SEARCH_ENGINE=searxng'
      # Uses the internal Docker DNS name "searxng" on port 8080
      - 'SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui:/app/backend/data
    networks:
      - ai-network
    restart: unless-stopped

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-rocm:latest
    # Or build from source:
    # build:
    #   context: .
    #   dockerfile: docker/rocm/Dockerfile
    restart: always
    devices:
      - /dev/dri
      - /dev/kfd
    group_add:
      # These are the group IDs for video, input, and render
      # Find yours with: getent group $GROUP_NAME | cut -d: -f3
      - 44    # video
      - 992   # input
      - 996   # render
    volumes:
      - miopen_config:/home/appuser/.config/miopen
      - miopen_cache:/home/appuser/.cache/miopen
    ports:
      - "8880:8880"
    environment:
      - USE_GPU=true
      - DOWNLOAD_MODEL=true
      - TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1
      - HSA_OVERRIDE_GFX_VERSION=11.0.0

    speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: speaches
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - speaches_cache:/home/ubuntu/.cache/huggingface
    networks:
      - ai-network

networks:
  # Both containers join this network to securely resolve each other's domain names
  ai-network:
    driver: bridge

volumes:
  open-webui:
  miopen_config:
  miopen_cache:
  speaches_cache:
  