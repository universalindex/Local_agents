version: '3.7'

services:
  searxng:
    container_name: searxng
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      # Mounts your existing massive configuration directory
      - ./searxng-data:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_LIMITER=false
    networks:
      - ai-network
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui-local-agents
    ports:
      - "3000:8080"
    environment:
      # 1. Point to your local Python Orchestrator running on your laptop's Port 8000
      - 'OPENAI_API_BASE_URL=http://host.docker.internal:8000/v1'
      - 'OPENAI_API_KEY=lemonade' # Filler key
      
      # 2. Automatically configure Open-WebUI's Web RAG to use SearXNG
      - 'ENABLE_RAG_WEB_SEARCH=True'
      - 'RAG_WEB_SEARCH_ENGINE=searxng'
      # Uses the internal Docker DNS name "searxng" on port 8080
      - 'SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui:/app/backend/data
    networks:
      - ai-network
    restart: unless-stopped

networks:
  # Both containers join this network to securely resolve each other's domain names
  ai-network:
    driver: bridge

volumes:
  open-webui:
