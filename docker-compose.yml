  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui-local-agents
    ports:
      - "3000:8080"
    environment:
      # 1. Point to your local Python Orchestrator running on your laptop's Port 8000
      - 'OPENAI_API_BASE_URL=http://host.docker.internal:8000/v1'
      - 'OPENAI_API_KEY=lemonade' # Filler key
      
      # 2. Automatically configure Open-WebUI's Web RAG to use SearXNG
      - 'ENABLE_RAG_WEB_SEARCH=True'
      - 'RAG_WEB_SEARCH_ENGINE=searxng'
      # Uses the internal Docker DNS name "searxng" on port 8080
      - 'SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui:/app/backend/data
    networks:
      - ai-network
    restart: unless-stopped

  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: speaches
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - speaches_cache:/home/ubuntu/.cache/huggingface
    networks:
      - ai-network
    environment:
    - LOOPBACK_HOST_URL=http://localhost:8000

networks:
  # Both containers join this network to securely resolve each other's domain names
  ai-network:
    driver: bridge

volumes:
  open-webui:
  miopen_config:
  miopen_cache:
  speaches_cache:
  